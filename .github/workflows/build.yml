name: Outpost

on:
  schedule:
    - cron: "15 0 * * 0"
  push:

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Lint scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          SHELLCHECK_OPTS: -x -P files/system/usr/lib/outpost
        with:
          scandir: files/system/usr/bin
          additional_files: files/scripts/dod-trust.sh files/scripts/cleanup.sh files/scripts/image-channel.sh .github/scripts/select-channel.sh .github/scripts/publish-testing-tag.sh files/system/usr/lib/outpost/lib.sh files/system/etc/bashrc files/system/etc/profile.d/outpost-starship.sh tests/cac-image.sh

      - name: Check helper behavior
        run: |
          python3 tests/helpers.py
          python3 tests/customization.py
          python3 tests/cac.py
          python3 tests/channels.py
          python3 tests/tui.py

      - name: Verify certificate bundles
        run: |
          (cd certificates && sha256sum -c unclass-certificates_pkcs7_DoD.zip.sha256)
          (cd files/system/usr/share/outpost/certs && sha256sum -c unclass-certificates_pkcs7_DoD.zip.sha256)
          cmp certificates/unclass-certificates_pkcs7_DoD.zip files/system/usr/share/outpost/certs/unclass-certificates_pkcs7_DoD.zip

  bluebuild:
    name: Build Outpost
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Select image channel
        id: channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/select-channel.sh >> "$GITHUB_OUTPUT"

      - name: Build Image
        uses: blue-build/github-action@3cd0c2835e691b87a7eb19261a6aee77a56169e2 # v1.11
        with:
          recipe: recipe.yml
          # A second checkout would discard the selected image name.
          skip_checkout: true
          cli_version: v0.9.37
          registry: ghcr.io
          registry_namespace: large-farva
          # Only main/testing pushes and manual runs may publish; schedules publish main only.
          push: ${{ steps.channel.outputs.publish == 'true' && github.repository == 'large-farva/outpost' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.ref == 'refs/heads/main')) }}
          cosign_private_key: ${{ steps.channel.outputs.publish == 'true' && github.repository == 'large-farva/outpost' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.ref == 'refs/heads/main')) && secrets.SIGNING_SECRET || '' }}
          registry_token: ${{ steps.channel.outputs.publish == 'true' && github.repository == 'large-farva/outpost' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/testing') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.ref == 'refs/heads/main')) && github.token || '' }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: false

      - name: Publish signed testing latest tag
        if: ${{ github.repository == 'large-farva/outpost' && github.ref == 'refs/heads/testing' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-testing-tag.sh
